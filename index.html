<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StreetViewVR</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block;touch-action:none}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#111;padding:20px;text-align:center;overflow:auto}
#diagnostics{width:min(100%,480px);max-height:50vh;overflow:auto;text-align:left;font:13px/1.4 monospace;white-space:pre-wrap;background:#222;border-radius:8px;padding:10px;box-sizing:border-box}
#ui input,#ui button{font-size:18px;padding:12px 16px;border-radius:10px;border:0;max-width:90%}
#ui button{background:#2d7ff9;color:#fff}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
#sensor-status{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.85);text-align:center;font-size:14px;z-index:40}
#sensor-status[hidden],#sensor-enable[hidden]{display:none}
#sensor-enable{display:block;margin:8px auto 0;padding:8px 12px;border:0;border-radius:8px;background:#2d7ff9;color:#fff;font:inherit}
</style></head><body>
<div id="ui"><h2>StreetViewVR</h2>
<input id="place" value="Paris, Eiffel Tower">
<button id="vr">Старт в VR (очки)</button>
<button id="flat" style="background:#444">Без очков (мышь / гироскоп)</button>
<button id="diagnose" style="background:#444">Проверить датчики</button>
<pre id="diagnostics" hidden></pre></div>
<div id="fade"></div>
<div id="sensor-status" role="status" hidden><span id="sensor-message"></span><button id="sensor-enable" type="button" hidden>Включить гироскоп</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TOKEN="MLY|39813497478295717|39d574015db5e3d8e95d4ebddbbfef1e";   // <-- сюда Access Token из Mapillary
const IMG="thumb_2048_url";             // для лучшего качества: "thumb_original_url" (тяжелее)
const CAMH=2.5, S=1024, D=Math.PI/180, G="https://graph.mapillary.com/", T=encodeURIComponent(TOKEN);
const $=id=>document.getElementById(id);
let stereo=false,cal=false,mapOpen=true,mapDirty=true,busy=false,cur=null,H0=null,az0=0,dots=[],tiles={};
let map={lat:48.8584,lon:2.2945,z:18};
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setScissorTest(true);
R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
addEventListener('resize',()=>R.setSize(innerWidth,innerHeight));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(90,1,.05,1000);
const sph=new THREE.Mesh(new THREE.SphereGeometry(500,64,32).scale(-1,1,1),new THREE.MeshBasicMaterial({color:0x222222}));scene.add(sph);
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const mat=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false},o));
// карта и значок
const ui=new THREE.Group();scene.add(ui);
const mc=cv(S,S),mx=mc.getContext('2d'),mapM=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),mat(mc));
mapM.position.set(0,-1.3,-1.2);mapM.renderOrder=10;ui.add(mapM);
const ic=cv(128,128),ix=ic.getContext('2d');ix.fillStyle='#2d7ff9';ix.beginPath();ix.arc(64,64,60,0,7);ix.fill();
ix.font='64px sans-serif';ix.textAlign='center';ix.fillText('🗺',64,86);
const iconM=new THREE.Mesh(new THREE.PlaneGeometry(.3,.3),mat(ic));iconM.position.set(0,-1,-.85);iconM.renderOrder=10;ui.add(iconM);
// курсор и подсказки
const ret=new THREE.Mesh(new THREE.RingGeometry(.018,.028,32),new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false,transparent:true,opacity:.9}));
ret.renderOrder=20;scene.add(ret);
const hc=cv(512,64),hx=hc.getContext('2d'),hud=new THREE.Mesh(new THREE.PlaneGeometry(.8,.1),mat(hc));
hud.renderOrder=30;hud.visible=false;scene.add(hud);let hT;
function say(t,ms=2500){hx.clearRect(0,0,512,64);hx.fillStyle='rgba(0,0,0,.7)';hx.fillRect(0,0,512,64);hx.fillStyle='#fff';
hx.font='26px sans-serif';hx.textAlign='center';hx.fillText(t,256,41);hud.material.map.needsUpdate=true;hud.visible=true;
clearTimeout(hT);if(ms)hT=setTimeout(()=>hud.visible=false,ms)}
// ориентация головы
const q=new THREE.Quaternion(),e=new THREE.Euler(),e2=new THREE.Euler(),q0=new THREE.Quaternion(),Z=new THREE.Vector3(0,0,1);
const q1=new THREE.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2);
let devQ=null,hasSensor=false,yaw=0,pit=0,sensorTimer,sensorPending=false,lastRelative=0;
function sensorStatus(message,retry=false){$('sensor-message').textContent=message;$('sensor-status').hidden=false;$('sensor-enable').hidden=!retry}
function orientation(ev){
if(![ev.alpha,ev.beta,ev.gamma].every(Number.isFinite))return;
const angle=screen.orientation&&Number.isFinite(screen.orientation.angle)?screen.orientation.angle:window.orientation||0;
e.set(ev.beta*D,ev.alpha*D,-ev.gamma*D,'YXZ');devQ=(devQ||new THREE.Quaternion()).setFromEuler(e).multiply(q1).multiply(q0.setFromAxisAngle(Z,-angle*D));
hasSensor=true;clearTimeout(sensorTimer);$('sensor-status').hidden=true}
function relativeOrientation(ev){if(![ev.alpha,ev.beta,ev.gamma].every(Number.isFinite))return;lastRelative=Date.now();orientation(ev)}
function absoluteOrientation(ev){if(!lastRelative||Date.now()-lastRelative>750)orientation(ev)}
async function enableSensor(){
if(sensorPending)return;
if(!window.isSecureContext){sensorStatus('Гироскопу нужен HTTPS. Открой сайт по защищённой ссылке.');return}
const Sensor=window.DeviceOrientationEvent;
if(!Sensor){sensorStatus('Браузер не поддерживает гироскоп. Можно управлять пальцем или мышью.');return}
sensorPending=true;$('sensor-enable').disabled=true;
try{
// На iPhone разрешение нужно запросить прямо из нажатия, до других await.
if(typeof Sensor.requestPermission==='function'&&await Sensor.requestPermission()!=='granted'){
sensorStatus('Доступ к гироскопу запрещён. Разреши датчики в настройках сайта и попробуй снова.',true);return}
removeEventListener('deviceorientation',relativeOrientation);addEventListener('deviceorientation',relativeOrientation);
removeEventListener('deviceorientationabsolute',absoluteOrientation);addEventListener('deviceorientationabsolute',absoluteOrientation);
if(!hasSensor){sensorStatus('Ожидание гироскопа…');clearTimeout(sensorTimer);
sensorTimer=setTimeout(()=>{if(!hasSensor)sensorStatus('Нет показаний гироскопа. Проверь доступ к датчикам в браузере. Пока можно управлять пальцем.',true)},3000)}
}catch(x){sensorStatus('Не удалось включить гироскоп. Проверь разрешение на датчики и попробуй снова.',true)}
finally{sensorPending=false;$('sensor-enable').disabled=false}}
$('sensor-enable').onclick=enableSensor;
// Проверка сырых событий браузера, независимо от управления камерой.
$('diagnose').onclick=()=>{
const panel=$('diagnostics');panel.hidden=false;
$('diagnose').disabled=true;
const data={orientation:{count:0,last:null,min:{},max:{}},absolute:{count:0,last:null,min:{},max:{}},motion:{count:0,last:null}};
const fmt=n=>Number.isFinite(n)?n.toFixed(1):'нет';
function render(){const line=(name,s)=>`${name}: событий ${s.count}\n  α ${fmt(s.last?.alpha)} [${fmt(s.min.alpha)}…${fmt(s.max.alpha)}]  β ${fmt(s.last?.beta)} [${fmt(s.min.beta)}…${fmt(s.max.beta)}]  γ ${fmt(s.last?.gamma)} [${fmt(s.min.gamma)}…${fmt(s.max.gamma)}]`;
panel.textContent=`Поворачивай телефон 10 секунд. Числа в скобках — минимум и максимум.\nHTTPS: ${window.isSecureContext?'да':'нет'}; угол экрана: ${screen.orientation?.angle??window.orientation??'нет'}\n${line('Ориентация',data.orientation)}\n${line('Абсолютная',data.absolute)}\nДвижение: событий ${data.motion.count}; вращение α ${fmt(data.motion.last?.alpha)}, β ${fmt(data.motion.last?.beta)}, γ ${fmt(data.motion.last?.gamma)}\n${status}`}
let status='Запрос доступа…';render();
function record(s,ev){s.count++;s.last={alpha:ev.alpha,beta:ev.beta,gamma:ev.gamma};for(const k of ['alpha','beta','gamma'])if(Number.isFinite(ev[k])){s.min[k]=Math.min(s.min[k]??ev[k],ev[k]);s.max[k]=Math.max(s.max[k]??ev[k],ev[k])}render()}
const onOrientation=ev=>record(data.orientation,ev),onAbsolute=ev=>record(data.absolute,ev),onMotion=ev=>{data.motion.count++;data.motion.last=ev.rotationRate;render()};
// Оба запроса выполняются непосредственно в обработчике нажатия.
let requests;try{requests=[window.DeviceOrientationEvent,window.DeviceMotionEvent].map(api=>typeof api?.requestPermission==='function'?api.requestPermission():Promise.resolve('не требуется'))}catch(err){requests=[Promise.reject(err)]}
Promise.allSettled(requests).then(results=>{status='Разрешения: '+results.map(r=>r.status==='fulfilled'?r.value:'ошибка').join(', ');render()});
addEventListener('deviceorientation',onOrientation);addEventListener('deviceorientationabsolute',onAbsolute);addEventListener('devicemotion',onMotion);
setTimeout(()=>{removeEventListener('deviceorientation',onOrientation);removeEventListener('deviceorientationabsolute',onAbsolute);removeEventListener('devicemotion',onMotion);status+='; проверка завершена';$('diagnose').disabled=false;render()},10000);
};
let dr=null;
R.domElement.addEventListener('pointerdown',ev=>dr={x:ev.clientX,y:ev.clientY,m:0});
addEventListener('pointermove',ev=>{if(!dr)return;const dx=ev.clientX-dr.x,dy=ev.clientY-dr.y;dr.x=ev.clientX;dr.y=ev.clientY;dr.m+=Math.abs(dx)+Math.abs(dy);
if(!hasSensor){yaw+=dx*.005;pit=Math.max(-1.5,Math.min(1.5,pit+dy*.005))}});
addEventListener('pointerup',()=>{if(dr&&dr.m<8)click();dr=null});
addEventListener('keydown',ev=>{if(ev.code=='Space'||ev.code=='Enter')click()});
const fwd=()=>new THREE.Vector3(0,0,-1).applyQuaternion(q), az=v=>Math.atan2(v.x,-v.z)/D;
// карта (тайлы OSM + точки панорам Mapillary)
const wpx=(lat,lon,z)=>{const n=256*2**z,s=Math.sin(lat*D);return[(lon+180)/360*n,(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n]};
const ll=(x,y,z)=>{const n=256*2**z;return[Math.atan(Math.sinh(Math.PI*(1-2*y/n)))/D,x/n*360-180]};
function drawMap(){const{lat,lon,z}=map,[cx,cy]=wpx(lat,lon,z),x0=cx-S/2,y0=cy-S/2,n=2**z;
mx.fillStyle='#ccd';mx.fillRect(0,0,S,S);
for(let tx=Math.floor(x0/256);tx<=Math.floor((x0+S)/256);tx++)for(let ty=Math.floor(y0/256);ty<=Math.floor((y0+S)/256);ty++){
if(ty<0||ty>=n)continue;const tt=((tx%n)+n)%n,k=z+'/'+tt+'/'+ty;let im=tiles[k];
if(!im){im=tiles[k]=new Image();im.crossOrigin='anonymous';im.onload=()=>mapDirty=true;im.src=`https://tile.openstreetmap.org/${k}.png`}
if(im.complete&&im.naturalWidth)mx.drawImage(im,tx*256-x0,ty*256-y0)}
mx.fillStyle='#e22';mx.strokeStyle='#fff';mx.lineWidth=2;
for(const d of dots){const[px,py]=wpx(d[1],d[0],z);mx.beginPath();mx.arc(px-x0,py-y0,7,0,7);mx.fill();mx.stroke()}
if(cur){const[px,py]=wpx(cur.lat,cur.lon,z);mx.fillStyle='#2d7ff9';mx.lineWidth=4;mx.beginPath();mx.arc(px-x0,py-y0,14,0,7);mx.fill();mx.stroke()}
mx.fillStyle='rgba(0,0,0,.18)';mx.fillRect(0,0,S,90);mx.fillRect(0,S-90,S,90);mx.fillRect(0,0,90,S);mx.fillRect(S-90,0,90,S);
mx.fillStyle='#fff';mx.strokeStyle='#333';mx.lineWidth=4;
for(const y of[60,180]){mx.beginPath();mx.arc(S-60,y,45,0,7);mx.fill();mx.stroke()}
mx.fillStyle='#000';mx.font='bold 70px sans-serif';mx.textAlign='center';mx.fillText('+',S-60,85);mx.fillText('−',S-60,205);
mx.font='20px sans-serif';mx.textAlign='left';mx.fillText('© OpenStreetMap, Mapillary',100,S-100);
mapM.material.map.needsUpdate=true;mapDirty=false}
const bb=(lat,lon,dl)=>{const dn=dl/Math.cos(lat*D);return`${lon-dn},${lat-dl},${lon+dn},${lat+dl}`};
const api=(lat,lon,dl,lim)=>fetch(`${G}images?fields=id,geometry&is_pano=true&limit=${lim}&bbox=${bb(lat,lon,dl)}&access_token=${T}`).then(r=>r.json());
async function loadDots(){try{const r=await api(map.lat,map.lon,.003,1000);if(r.error)say('Mapillary: '+r.error.message,4000);
dots=(r.data||[]).map(i=>[...i.geometry.coordinates,i.id])}catch(x){say('Нет связи с Mapillary')}mapDirty=true}
// загрузка панорамы
async function go(id){if(busy)return;busy=true;$('fade').style.opacity=1;say('Загрузка…',0);
try{const i=await(await fetch(`${G}${id}?fields=geometry,computed_geometry,compass_angle,computed_compass_angle,is_pano,${IMG}&access_token=${T}`)).json();
const tex=await new Promise((ok,no)=>new THREE.TextureLoader().setCrossOrigin('anonymous').load(i[IMG],ok,0,no));
tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;
if(sph.material.map)sph.material.map.dispose();sph.material.dispose();sph.material=new THREE.MeshBasicMaterial({map:tex});
const g=(i.computed_geometry||i.geometry).coordinates,c=i.computed_compass_angle??i.compass_angle??0;
if(H0===null)H0=c-az0;
cur={id,lon:g[0],lat:g[1]};sph.rotation.y=-(c-H0+90)*D;map.lat=g[1];map.lon=g[0];loadDots();
hud.visible=false;if(!i.is_pano)say('Это не панорама — картинка искажена',3000)
}catch(x){say('Не удалось загрузить панораму (токен/сеть)',4000);mapOpen=true}
$('fade').style.opacity=0;busy=false}
// клики
const rc=new THREE.Raycaster(),O=new THREE.Vector3();
const hit=(m,d)=>{rc.set(O,d);const r=rc.intersectObject(m)[0];return r&&r.uv};
function click(){if(!cal||busy)return;const d=fwd(),u=mapOpen?hit(mapM,d):hit(iconM,d);
if(u){if(mapOpen)mapClick(u);else{mapOpen=true;mapDirty=true}return}
if(cur)move(d)}
function mapClick(u){const x=u.x*S,y=(1-u.y)*S;
if(x>S-120&&y<240){map.z=Math.max(15,Math.min(19,map.z+(y<120?1:-1)));loadDots();return}
const[cx,cy]=wpx(map.lat,map.lon,map.z),sh=S*.4;let dx=0,dy=0;
if(x<90)dx=-sh;else if(x>S-90)dx=sh;if(y<90)dy=-sh;else if(y>S-90)dy=sh;
if(dx||dy){[map.lat,map.lon]=ll(cx+dx,cy+dy,map.z);loadDots();return}
let best=null,bd=45;for(const d of dots){const[px,py]=wpx(d[1],d[0],map.z),dd=Math.hypot(px-cx-(x-S/2),py-cy-(y-S/2));if(dd<bd){bd=dd;best=d}}
if(best){mapOpen=false;go(best[2])}else{[map.lat,map.lon]=ll(cx+x-S/2,cy+y-S/2,map.z);loadDots();say('Тут нет панорам, карта сдвинута')}}
const MPL=111320,meters=(x1,y1,x2,y2)=>Math.hypot((x1-x2)*MPL*Math.cos(y2*D),(y1-y2)*MPL);
async function move(d){if(d.y>-.1){say('Смотри вниз, на дорогу');return}
const hd=H0+az(d),dist=Math.max(4,Math.min(40,CAMH/Math.tan(Math.asin(-d.y))));
const lt=cur.lat+dist*Math.cos(hd*D)/MPL,ln=cur.lon+dist*Math.sin(hd*D)/(MPL*Math.cos(cur.lat*D));
try{const r=await api(lt,ln,.0004,100);let best=null,bd=1e9;
for(const i of r.data||[]){if(i.id===cur.id)continue;const[x,y]=i.geometry.coordinates;if(meters(x,y,cur.lon,cur.lat)<2.5)continue;
const dd=meters(x,y,ln,lt);if(dd<bd){bd=dd;best=i}}
best?go(best.id):say('Там нет панорамы')}catch(x){say('Нет связи с Mapillary')}}
// старт
function calibrate(){const d=fwd();az0=az(d);ui.rotation.y=Math.atan2(-d.x,-d.z);ui.updateMatrixWorld(true);
mapM.lookAt(0,0,0);iconM.lookAt(0,0,0);cal=true;mapDirty=true;say('Посмотри вниз и выбери место на карте',5000)}
async function start(st){if(TOKEN.includes('ВСТАВЬ')){alert('Вставь Access Token Mapillary в начале скрипта');return}
stereo=st;
await enableSensor();
if(st){try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(x){}try{navigator.wakeLock.request('screen').catch(()=>{})}catch(x){}}
const p=$('place').value.trim();$('ui').style.display='none';
if(p){try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(p))).json();
if(r[0]){map.lat=+r[0].lat;map.lon=+r[0].lon}}catch(x){}}
loadDots();
for(let s=st?5:1;s>0;s--){say('Надень очки и смотри прямо: '+s,0);await new Promise(r=>setTimeout(r,1000))}
calibrate()}
$('vr').onclick=()=>start(true);$('flat').onclick=()=>start(false);
// рендер
function frame(){requestAnimationFrame(frame);
if(hasSensor&&devQ)q.copy(devQ);else q.setFromEuler(e2.set(pit,yaw,0,'YXZ'));
const f=fwd();ret.position.copy(f).multiplyScalar(2);ret.quaternion.copy(q);ret.visible=cal;
hud.position.set(0,-.35,-1.5).applyQuaternion(q);hud.quaternion.copy(q);
mapM.visible=cal&&mapOpen;iconM.visible=cal&&!mapOpen;if(mapDirty&&mapOpen)drawMap();
const W=innerWidth,H=innerHeight;
(stereo?[-1,1]:[0]).forEach((s,k)=>{const w=stereo?W/2:W;cam.aspect=w/H;cam.updateProjectionMatrix();
cam.position.set(s*.032,0,0).applyQuaternion(q);cam.quaternion.copy(q);
R.setViewport(k*w,0,w,H);R.setScissor(k*w,0,w,H);R.render(scene,cam)})}
frame();
</script></body></html>
